<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { width: 100%; max-width: 400px; text-align: center; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; }

    .btn:active { transform: scale(0.98); }
    .btn-tlg { background: linear-gradient(135deg, #0088cc, #006699); box-shadow: 0 4px 14px rgba(0, 136, 204, 0.3); }
    .btn-yt { background: #ff0000; box-shadow: 0 4px 14px rgba(255, 0, 0, 0.25); }
    .btn-ig { 
      background: #d6249f;
      background: -webkit-radial-gradient(30% 107%, circle, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      box-shadow: 0 4px 14px rgba(214, 36, 159, 0.35); 
    }
    .footer { font-size: 11px; color: #484f58; margin-top: 24px; }
  </style>
</head>
